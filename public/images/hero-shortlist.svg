<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">Personally vetted payment-processor shortlist</title>
  <desc id="d">Editorial fintech-style shortlist with three provider cards showing effective rates and the gap versus the merchant's current rate.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(184 35% 96%)"/>
      <stop offset="100%" stop-color="hsl(184 38% 92%)"/>
    </linearGradient>
  </defs>

  <!-- Background panel -->
  <rect width="520" height="540" rx="28" fill="url(#bg)"/>

  <!-- Header pill -->
  <g>
    <rect x="40" y="36" width="220" height="34" rx="17" fill="hsl(184 50% 36%)"/>
    <text x="150" y="58" text-anchor="middle" fill="#fff"
      font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
      font-size="12" font-weight="700" letter-spacing="1.6">YOUR SHORTLIST · 2026</text>
  </g>

  <!-- ============ CARD 1 ============ -->
  <g>
    <rect x="44" y="100" width="432" height="108" rx="18" fill="rgba(15,42,52,0.06)"/>
    <rect x="40" y="96" width="432" height="108" rx="18" fill="#ffffff" stroke="#dbe2e8" stroke-width="1.2"/>

    <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
      <text x="64" y="138" fill="#0f172a" font-size="22" font-weight="700" letter-spacing="-0.3">Provider A</text>
      <text x="64" y="162" fill="#475569" font-size="13">Interchange-plus pricing</text>
      <text x="64" y="180" fill="#64748b" font-size="12">Next-day funding · IC++ available</text>

      <text x="448" y="148" text-anchor="end" fill="#0f172a"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, sans-serif"
        font-size="30" font-weight="700">2.15<tspan font-size="20" dx="-1">%</tspan></text>
      <text x="448" y="172" text-anchor="end" fill="hsl(184 50% 36%)" font-size="11" font-weight="700" letter-spacing="0.4">SAVES 0.32% VS YOUR RATE</text>
    </g>
  </g>

  <!-- ============ CARD 2 ============ -->
  <g>
    <rect x="44" y="228" width="432" height="108" rx="18" fill="rgba(15,42,52,0.06)"/>
    <rect x="40" y="224" width="432" height="108" rx="18" fill="#ffffff" stroke="#dbe2e8" stroke-width="1.2"/>

    <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
      <text x="64" y="266" fill="#0f172a" font-size="22" font-weight="700" letter-spacing="-0.3">Provider B</text>
      <text x="64" y="290" fill="#475569" font-size="13">Multi-acquirer routing</text>
      <text x="64" y="308" fill="#64748b" font-size="12">Capped reserve · 2-day funding</text>

      <text x="448" y="276" text-anchor="end" fill="#0f172a"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, sans-serif"
        font-size="30" font-weight="700">2.28<tspan font-size="20" dx="-1">%</tspan></text>
      <text x="448" y="300" text-anchor="end" fill="hsl(184 50% 36%)" font-size="11" font-weight="700" letter-spacing="0.4">SAVES 0.19% VS YOUR RATE</text>
    </g>
  </g>

  <!-- ============ CARD 3 ============ -->
  <g>
    <rect x="44" y="356" width="432" height="108" rx="18" fill="rgba(15,42,52,0.06)"/>
    <rect x="40" y="352" width="432" height="108" rx="18" fill="#ffffff" stroke="#dbe2e8" stroke-width="1.2"/>

    <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
      <text x="64" y="394" fill="#0f172a" font-size="22" font-weight="700" letter-spacing="-0.3">Provider C</text>
      <text x="64" y="418" fill="#475569" font-size="13">Fastest go-live</text>
      <text x="64" y="436" fill="#64748b" font-size="12">Flat rate · best when speed beats margin</text>

      <text x="448" y="404" text-anchor="end" fill="#0f172a"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, sans-serif"
        font-size="30" font-weight="700">2.59<tspan font-size="20" dx="-1">%</tspan></text>
      <text x="448" y="428" text-anchor="end" fill="hsl(28 90% 50%)" font-size="11" font-weight="700" letter-spacing="0.4">+0.12% VS YOUR RATE</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="260" y="500" text-anchor="middle" fill="#6b7c89"
    font-family="Georgia, serif" font-size="12" font-style="italic">Illustrative example · real shortlist tailored to your business</text>
</svg>
